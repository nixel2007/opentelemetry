name: Публикация релиза

on:
  release:
    types:
      - published
  workflow_dispatch:

# Доверенная публикация: хабу предъявляется OIDC id-token конвейера, токен хаба в секретах не нужен
permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: autumn-library/workflows/.github/workflows/release.yml@v1
    with:
      package_mask: "opentelemetry-*.ospx"
      trusted_publishing: true
